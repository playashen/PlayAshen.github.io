<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ashen</title>
<meta name="description" content="Ashen is a multiplayer survival game you play in your browser. Survive the ash. Outlast the night.">
<meta name="theme-color" content="#121a21">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow:wght@500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* The front door to Ashen. This page never changes address; it finds where the game server is right now and sends you there.
   Same look as the game's home screen: a clearing at night, a campfire off the bottom-left, the moon at the top-right. */
:root{--night:#121a21;--ash:#97a0a3;--bone:#ece5d5;--ember:#f39a3b;--ember-lo:#9a4a17;--cinder:#c4452e;--lichen:#a3b886}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{display:flex;align-items:center;background:
  radial-gradient(ellipse 65% 60% at 6% 108%,rgba(255,140,60,.3),transparent 70%),
  radial-gradient(ellipse 60% 55% at 102% -4%,rgba(90,122,144,.32),transparent 70%),var(--night);
  color:var(--bone);font:500 18px/1.5 'Barlow',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{width:100%;max-width:820px;padding:56px clamp(20px,8vw,120px)}
h1{margin:0 0 0 -.05em;font:400 clamp(92px,19vw,184px)/.88 'Alfa Slab One',Georgia,serif;letter-spacing:-.025em}
h1 span{display:inline-block;padding:0 4px 10px;background:linear-gradient(178deg,#ffe8b8 0%,#f9b862 30%,#e8762c 62%,#8a3216 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 30px rgba(243,130,48,.32)) drop-shadow(0 5px 0 rgba(6,9,12,.55))}
.tag{margin:6px 0 44px;color:var(--ash);font-size:clamp(19px,2.6vw,24px)}
.status{display:flex;align-items:center;gap:12px;font:600 clamp(22px,3vw,26px)/1.2 'Barlow Condensed',sans-serif}
.dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--ash)}
.dot.wait{animation:pulse 1.1s ease-in-out infinite}
.dot.ok{background:var(--lichen);box-shadow:0 0 0 4px rgba(163,184,134,.16)}
.dot.bad{background:var(--cinder);box-shadow:0 0 0 4px rgba(196,69,46,.18)}
@keyframes pulse{50%{opacity:.25}}
.sub{margin:8px 0 0 22px;color:var(--ash);font-size:17px;max-width:54ch}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:18px;margin-top:30px}
.go{display:inline-flex;align-items:center;justify-content:center;height:64px;min-width:220px;padding:0 34px;border-radius:12px;
  background:linear-gradient(180deg,#f8ae50,#ef9233);color:#2b1406;text-decoration:none;font:400 30px/1 'Alfa Slab One',Georgia,serif;
  box-shadow:0 5px 0 var(--ember-lo),0 22px 44px -16px rgba(243,130,48,.6),inset 0 1px 0 rgba(255,236,200,.65)}
.go:hover{background:linear-gradient(180deg,#ffbb62,#f59c3c)}
.go:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ember-lo),inset 0 1px 0 rgba(255,236,200,.65)}
.retry{font:600 19px 'Barlow Condensed',sans-serif;color:var(--ember);background:none;border:0;border-bottom:1px solid rgba(243,154,59,.4);padding:4px 1px;cursor:pointer}
.retry:hover{color:#ffd28a;border-bottom-color:#ffd28a}
.go:focus-visible,.retry:focus-visible{outline:2px solid #ffd28a;outline-offset:4px}
[hidden]{display:none!important}
.foot{margin:64px 0 0;color:rgba(151,160,163,.75);font-size:15px;max-width:58ch}
@media (prefers-reduced-motion:reduce){.dot.wait{animation:none}}
</style>
</head>
<body>
<main>
  <h1><span>Ashen</span></h1>
  <p class="tag">Survive the ash. Outlast the night.</p>

  <div class="status" role="status" aria-live="polite"><i class="dot wait" id="dot" aria-hidden="true"></i><span id="msg">Finding the server…</span></div>
  <p class="sub" id="sub"></p>
  <div class="actions">
    <a class="go" id="go" href="#" hidden>Play</a>
    <button class="retry" id="retry" type="button" hidden>Check again</button>
  </div>

  <p class="foot">Ashen is a multiplayer survival game you play in your browser. The server runs on a home PC, so it is only up while its owner has it switched on. Your character is remembered in this browser.</p>
</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
const local = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);   // testing the page on the PC that runs the server
// where the current link is kept: this site's own link.json, and the same file through GitHub's API (which is never stale)
const owner = location.hostname.endsWith('.github.io') ? location.hostname.split('.')[0] : null;
const repo = owner && (location.pathname.split('/')[1] || `${owner}.github.io`);
const API = owner ? `https://api.github.com/repos/${owner}/${repo}/contents/link.json` : null;
const SAFE = local ? /^https?:\/\/(127\.0\.0\.1|localhost)(:\d+)?$|^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/ : /^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/;   // the only places this page will send you

// Your character: the server knows you by a secret key. The game's address changes whenever the server restarts, so this page
// keeps your key and hands it to the game every time. Without it you would start over after every restart.
const KEY = 'ashen-player-key';
function playerKey(){
  let k = null; try { k = localStorage.getItem(KEY); } catch (e) {}
  if (!k || !/^[A-Za-z0-9_-]{43}$/.test(k)){
    const b = crypto.getRandomValues(new Uint8Array(32));
    k = btoa(String.fromCharCode(...b)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    try { localStorage.setItem(KEY, k); } catch (e) {}
  }
  return k;
}

const show = (state, msg, sub) => { $('dot').className = 'dot ' + state; $('msg').textContent = msg; $('sub').textContent = sub || ''; };
const ago = t => { const s = Math.max(0, (Date.now() - t)/1000); if (s < 90) return 'a minute ago'; if (s < 3600) return Math.round(s/60) + ' minutes ago'; if (s < 172800) return Math.round(s/3600) + ' hours ago'; return Math.round(s/86400) + ' days ago'; };
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, no) => setTimeout(() => no(new Error('timeout')), ms))]);

async function readLink(){
  const tries = [];
  if (API) tries.push(() => fetch(API, { headers: { Accept: 'application/vnd.github.raw+json' }, cache: 'no-store' }));
  tries.push(() => fetch('link.json?t=' + Date.now(), { cache: 'no-store' }));
  for (const t of tries){
    try { const r = await withTimeout(t(), 8000); if (r.ok) return await r.json(); } catch (e) {}
  }
  return null;
}

let timer = null;
async function check(){
  clearTimeout(timer); $('retry').hidden = true;
  show('wait', 'Finding the server…');
  const info = await readLink();
  if (!info){ return later('bad', 'Could not look up the server', 'Check your internet connection. This page tries again by itself.'); }
  const url = typeof info.url === 'string' ? info.url.replace(/\/+$/, '') : '';
  const when = Date.parse(info.at);
  if (!info.online || !SAFE.test(url)) return later('bad', 'The server is offline', Number.isFinite(when) ? `It was last switched off ${ago(when)}. This page checks again every 20 seconds.` : 'This page checks again every 20 seconds.');
  let st = null;
  try { const r = await withTimeout(fetch(url + '/status', { cache: 'no-store' }), 8000); if (r.ok) st = await r.json(); } catch (e) {}
  if (!st) return later('bad', 'The server is not answering', 'It may be starting up or just switched off. This page checks again every 20 seconds.');
  const n = st.online | 0, max = st.max | 0, full = max && n >= max;
  const go = url + '/#t=' + playerKey();
  $('go').href = go; $('go').hidden = false;
  if (full) return later('bad', `The server is full (${n} of ${max})`, 'Someone has to leave first. This page checks again every 20 seconds.', true);
  show('ok', n ? `${n} of ${max} survivors online` : `The server is up. Room for ${max}.`, 'Taking you there…');
  setTimeout(() => location.replace(go), 900);
}
function later(state, msg, sub, keepPlay){
  show(state, msg, sub); $('retry').hidden = false; if (!keepPlay) $('go').hidden = true;
  timer = setTimeout(check, 20000);
}
$('retry').addEventListener('click', check);
check();
</script>
</body>
</html>
